name: Publish AnyKernel3 to release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 下载构件并打包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 37457454269 -R ${{ github.repository }} -n "6.6.118-android15-2026-01-ReSukiSU-AnyKernel3" -D ak3
          ls -la ak3
          cd ak3
          zip -9 -r ../AnyKernel3_6.6.118_ReSukiSU_cgroupfix.zip .
          cd ..
          ls -l AnyKernel3_6.6.118_ReSukiSU_cgroupfix.zip

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create cgroupfix-6.6.118 AnyKernel3_6.6.118_ReSukiSU_cgroupfix.zip \
            -R ${{ github.repository }} \
            --title "6.6.118 cgroupfix (ReSukiSU / 4k / android15-6.6)" \
            --notes "AOSP GKI android15-6.6 @ 6.6.118, ReSukiSU+SUSFS, DroidSpaces enable, IPv6 NAT + CPU/PIDs limits (kABI-safe patch)"
