name: 'Enable SUSFS Kernel Configs'
description: 'Enable SUSFS-related kernel configuration options'

runs:
  using: "composite"
  steps:
    - name: Enable SUSFS Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        # [matched-build] SUSFS deliberately left disabled so the kernel matches
        # the device's known-working kernel (# CONFIG_KSU_SUSFS is not set there).
        # The SUSFS patches are still applied by the workflow; only the configs
        # are not enabled, so the SUSFS code stays compiled out.
        config_list: |
          # no SUSFS configs enabled (matched build)
